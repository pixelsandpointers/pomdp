[package]
name = "pomdp"
version = "0.1.1"
edition = "2024"
description = "A Rust port of Julia's POMDPs.jl: an interface and toolkit for defining and solving Markov decision processes (MDPs) and partially observable MDPs (POMDPs), with Python bindings."
license = "MIT OR Apache-2.0"
keywords = ["pomdp", "mdp", "rl", "planning", "python"]
categories = ["science", "algorithms", "simulation"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
rand = "0.9"

[features]
python = ["dep:pyo3"]
